<!DOCTYPE html>
<html lang="en">

<head>
    <title>Manage Todo</title>

    <!-- BOOTSTRAP CDN LINK -->
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <div class="container my-5">
<h1 id="heading">ADD TODO</h1>
        <form id="todoListForm" action="" class="my-5 border rounded p-5 w-75">

            <!-- Title -->
            <div class="mb-3">
                <input id="titleInput" type="text" placeholder="Title" class="form-control">
            </div>

            <!-- Date -->
            <div class="mb-3">
                <input id="dateInput" type="date" placeholder="Date" class="form-control">
            </div>

            <!-- Status -->
            <div class="mb-3">
                Status :
                <label for="completed">Completed</label>
                <input type="checkbox" id="completed">
            </div>

            <!-- Buttons -->
            <div class="mb-3">
                <button type="submit" class="btn btn-success">Save</button>
                <button type="button" onclick="location.href='index.html'" class="btn btn-warning">Cancel</button>
            </div>

        </form>
    </div>
</body>

<script src="./todoForm.js"></script>
</html>
